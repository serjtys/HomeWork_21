{% extends 'catalog/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <article>
                {% if object.preview_image %}
                <img src="{{ object.preview_image.url }}" class="img-fluid rounded mb-4" alt="{{ object.title }}">
                {% endif %}
                
                <h1 class="display-5">{{ object.title }}</h1>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <small class="text-muted">Опубликовано: {{ object.created_at|date:"d.m.Y H:i" }}</small>
                    <small class="text-muted">Просмотров: {{ object.views_count }}</small>
                </div>

                <div class="content mb-4">
                    {{ object.content|linebreaks }}
                </div>

                <div class="d-flex gap-2">
                    <a href="{% url 'blog:list' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Назад к списку
                    </a>
                    <a href="{% url 'blog:update' object.pk %}" class="btn btn-outline-primary">
                        <i class="bi bi-pencil"></i> Редактировать
                    </a>
                    <a href="{% url 'blog:delete' object.pk %}" class="btn btn-outline-danger">
                        <i class="bi bi-trash"></i> Удалить
                    </a>
                </div>
            </article>
        </div>
    </div>
</div>
{% endblock %}
