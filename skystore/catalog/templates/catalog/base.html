{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- Боковое меню -->
    <div class="sidebar">
        <div class="menu-items">
            <h4 class="mb-4">Меню</h4>
            <a href="/" class="menu-item {% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-house-fill"></i> Главная
            </a>
            <a href="/catalog/" class="menu-item {% if request.path == '/catalog/' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> Каталог
            </a>
            <a href="/contacts/" class="menu-item {% if request.path == '/contacts/' %}active{% endif %}">
                <i class="bi bi-person-fill"></i> Контакты
            </a>
        </div>
    </div>


    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
