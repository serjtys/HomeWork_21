<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <!-- ! Bootstrap CSS (проверь URL) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- ! Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- ! Наш CSS (абсолютный путь) -->
    <link rel="stylesheet" href="http://localhost:8000/static/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="menu-items">
            <h4 class="mb-4">Меню</h4>
            <a href="/" class="menu-item {% if active == 'index' %}active{% endif %}">
                <i class="bi bi-house-fill menu-icon"></i>Главная
            </a>
            <a href="/catalog" class="menu-item {% if active == 'catalog' %}active{% endif %}">
                <i class="bi bi-speedometer2 menu-icon"></i>Каталог
            </a>
            <a href="/category" class="menu-item {% if active == 'category' %}active{% endif %}">
                <i class="bi bi-list-ul menu-icon"></i>Категория
            </a>
            <a href="/contacts" class="menu-item {% if active == 'contacts' %}active{% endif %}">
                <i class="bi bi-person-fill menu-icon"></i>Контакты
            </a>
        </div>
        <div class="user-section">
            <div class="user-dropdown">
                <div class="user-avatar">
                    <img src="/static/img/user.jpg" class="rounded-circle me-2" alt="User">
                    <span>Иван Иванов</span>
                </div>
                <div class="dropdown-content">
                    <a href="#"><i class="bi bi-person me-2"></i>Профиль</a>
                    <a href="#"><i class="bi bi-box-arrow-right me-2"></i>Выход</a>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- ! Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
